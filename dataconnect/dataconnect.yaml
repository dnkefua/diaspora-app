# Firebase Data Connect — service config
# Service was provisioned in Firebase Console; this file lets the CLI deploy
# schema migrations and connector operations to it.
#
# Reference:
#   https://firebase.google.com/docs/data-connect/quickstart
#   https://firebase.google.com/docs/sql-connect/manage-schemas-and-connectors

specVersion: "v1"
serviceId: "the-diaspora-app-service"
location: "us-east4"

schema:
  source: "./schema"
  datasource:
    postgresql:
      database: "the-diaspora-app-database"
      cloudSql:
        instanceId: "the-diaspora-app-instance"
      # COMPATIBLE blocks migrations that would drop or break existing columns,
      # making rolling updates safe. Switch to STRICT for clean greenfields only.
      schemaValidation: "COMPATIBLE"

connectorDirs:
  - "./connector"
